# Configuration Supabase CLI (développement local : `supabase start`).
# Le projet distant (offre gratuite, région UE) est lié avec `supabase link`.
project_id = "haccp-foodtruck"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
# Les comptes gérant sont créés par l'administrateur, jamais par inscription libre.
enable_signup = false
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

# Edge Functions : les appareils s'authentifient par jeton (x-device-token), pas par JWT.
[functions.sync-push]
verify_jwt = false

[functions.sync-pull]
verify_jwt = false

[functions.health]
verify_jwt = false

# Enrôlement d'un appareil : réservé au gérant connecté (JWT Supabase).
[functions.device-enroll]
verify_jwt = true
