# Configuration Supabase CLI (développement local : `supabase start`).
# Le projet distant (offre gratuite, région UE) est lié avec `supabase link`.
project_id = "haccp-foodtruck"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
# Pas d'inscription libre : le gérant est créé une seule fois par l'Edge Function bootstrap-manager.
enable_signup = false
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

# Edge Functions : les appareils s'authentifient par jeton (x-device-token), pas par JWT.
[functions.sync-push]
verify_jwt = false

[functions.sync-pull]
verify_jwt = false

[functions.health]
verify_jwt = false

# Enrôlement d'un appareil : réservé au gérant connecté (JWT Supabase).
[functions.device-enroll]
verify_jwt = true

# Inscription unique du gérant depuis l'app (aucun gérant encore => pas de JWT possible).
# Protégée par : refus 409 dès qu'un gérant existe (vérifié sous verrou en SQL) et limite anti-abus.
[functions.bootstrap-status]
verify_jwt = false

[functions.bootstrap-manager]
verify_jwt = false

# Lot 3 : envoi des photos par les appareils (jeton x-device-token, comme sync-push).
[functions.photo-upload]
verify_jwt = false

# Purge quotidienne des photos expirées : appel planifié avec l'en-tête x-purge-secret
# (secret PURGE_PHOTOS_SECRET), pas de JWT.
[functions.purge-photos]
verify_jwt = false

# Lot 6 : mesures des capteurs (webhooks Shelly…) : jeton du capteur dans l'URL (?token=) ou
# l'en-tête x-sensor-token — les webhooks Shelly ne savent pas envoyer de JWT.
[functions.sensor-ingest]
verify_jwt = false

# Moteur d'alertes planifié (pg_cron + pg_net, toutes les 5 min) : en-tête x-alerts-secret
# (secret ALERTS_EVALUATE_SECRET), pas de JWT.
[functions.alerts-evaluate]
verify_jwt = false

# Abonnement Web Push d'un appareil (jeton x-device-token, comme sync-push).
[functions.push-subscribe]
verify_jwt = false

# Clé publique VAPID (publique par nature).
[functions.push-config]
verify_jwt = false

# Lot 7 : vérification d'intégrité du registre, réservée au gérant connecté (JWT Supabase,
# puis contrôle dans managers par la fonction).
[functions.verify-integrity]
verify_jwt = true
